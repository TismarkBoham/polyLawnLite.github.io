<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polylawn — Rain Suitability</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         max-width: 480px; margin: 60px auto; padding: 0 20px; color: #1a1a1a; }
  h1 { font-size: 18px; margin-bottom: 18px; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px 12px; font-size: 15px; border: 1px solid #ccc;
          border-radius: 6px; font-family: inherit; }
  button { padding: 10px 18px; font-size: 15px; border: none; border-radius: 6px;
           background: #2d7a4f; color: #fff; cursor: pointer; font-family: inherit; }
  button:disabled { background: #9bc2ab; }
  #status { font-size: 13px; color: #767676; margin-top: 10px; min-height: 16px; }
  #out { margin-top: 24px; display: none; }
  .loc { font-size: 13px; color: #767676; margin-bottom: 14px; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; }
  .card.rank1 { border-color: #2d7a4f; background: #eef7f1; }
  .name { font-weight: 700; font-size: 15px; }
  .type { font-size: 12px; color: #767676; margin-bottom: 6px; }
  .score { font-size: 22px; font-weight: 700; color: #2d7a4f; float: right; }
  .why { font-size: 12px; color: #555; margin-top: 4px; }
</style>
</head>
<body>

<h1>Which grass fits your rainfall?</h1>
<div class="row">
  <input id="address" placeholder="Enter an address">
  <button id="btn" onclick="run()">Check</button>
</div>
<div id="status"></div>

<div id="out">
  <div class="loc" id="loc"></div>
  <div id="cards"></div>
</div>

<script>
// Three grasses spanning the drought-tolerance spectrum, each with an
// "ideal" summer (Jun–Aug) rainfall range in inches. Suitability is scored
// by how close the site's actual summer rainfall falls to that range —
// a simplified, single-variable version of the same optimum-range
// suitability-mapping approach used in turfgrass/ecological siting studies:
// full score inside the ideal range, stepped penalties the further outside it you go.
var PLANTS = [
  { name: 'Buffalograss',      type: 'Drought tolerant', lo: 0,  hi: 5  },
  { name: 'Tall Fescue',       type: 'Drought OK',        lo: 5,  hi: 10 },
  { name: 'Kentucky Bluegrass',type: 'Needs regular rain',lo: 10, hi: 18 },
];

function siScore(precip, lo, hi) {
  var gap = precip < lo ? lo - precip : precip > hi ? precip - hi : 0;
  var score = gap === 0 ? 100 : gap <= 2 ? 78 : gap <= 4 ? 55 : gap <= 7 ? 32 : 12;
  return score;
}

async function geocode(addr) {
  var r = await fetch('https://photon.komoot.io/api/?q=' + encodeURIComponent(addr) + '&limit=1&lang=en');
  var d = await r.json();
  if (!d.features || !d.features.length) return null;
  var f = d.features[0], p = f.properties;
  return {
    lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0],
    name: [p.name, p.city || p.county, p.state, p.country].filter(Boolean).join(', ')
  };
}

async function fetchClimate(lat, lon) {
  var url = 'https://archive-api.open-meteo.com/v1/archive'
    + '?latitude=' + lat.toFixed(4) + '&longitude=' + lon.toFixed(4)
    + '&start_date=2019-01-01&end_date=2023-12-31'
    + '&daily=precipitation_sum&timezone=auto';
  var r = await fetch(url);
  var j = await r.json();
  if (!j.daily || !j.daily.time) return null;

  // Sum precipitation for June, July, August each year, then average across years
  var byYear = {};
  j.daily.time.forEach(function (t, i) {
    var y = t.slice(0, 4), m = parseInt(t.slice(5, 7));
    if (m >= 6 && m <= 8) {
      byYear[y] = (byYear[y] || 0) + (j.daily.precipitation_sum[i] || 0);
    }
  });
  var years = Object.keys(byYear);
  var avgMm = years.reduce(function (s, y) { return s + byYear[y]; }, 0) / years.length;
  return avgMm / 25.4; // mm -> inches, average summer (Jun-Aug) rainfall
}

async function run() {
  var addr = document.getElementById('address').value.trim();
  var btn = document.getElementById('btn');
  var status = document.getElementById('status');
  var out = document.getElementById('out');
  out.style.display = 'none';
  status.textContent = '';
  if (!addr) { status.textContent = 'Enter an address.'; return; }

  btn.disabled = true; btn.textContent = 'Checking…';
  status.textContent = 'Geocoding address…';

  try {
    var geo = await geocode(addr);
    if (!geo) throw new Error('Address not found.');

    status.textContent = 'Fetching climate data…';
    var summerPrecipIn = await fetchClimate(geo.lat, geo.lon);
    if (summerPrecipIn == null) throw new Error('Climate data unavailable.');

    var results = PLANTS.map(function (p) {
      return { plant: p, si: siScore(summerPrecipIn, p.lo, p.hi) };
    }).sort(function (a, b) { return b.si - a.si; });

    document.getElementById('loc').textContent =
      geo.name + ' — avg summer (Jun–Aug) rainfall: ' + summerPrecipIn.toFixed(1) + '"';

    document.getElementById('cards').innerHTML = results.map(function (r, i) {
      return '<div class="card' + (i === 0 ? ' rank1' : '') + '">'
        + '<span class="score">' + r.si + '</span>'
        + '<div class="name">#' + (i + 1) + ' ' + r.plant.name + '</div>'
        + '<div class="type">' + r.plant.type + '</div>'
        + '<div class="why">Ideal summer rainfall ' + r.plant.lo + '–' + r.plant.hi + '" · site gets ' + summerPrecipIn.toFixed(1) + '"</div>'
        + '</div>';
    }).join('');

    out.style.display = 'block';
    status.textContent = '';
  } catch (e) {
    status.textContent = e.message;
  }
  btn.disabled = false; btn.textContent = 'Check';
}

document.getElementById('address').addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });
</script>
</body>
</html>
